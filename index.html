<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artesanías Pérez</title>
    <style>
        :root {
            --primary: #8B4513;
            --secondary: #D2B48C;
            --bg: #FDFBF7;
            --text: #2C221E;
            --accent: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #eee;
        }

        .card-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .card p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .price {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .cart-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--accent);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .badge {
            background: white;
            color: var(--accent);
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.9rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 12px;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-item-controls button {
            background: #ddd;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .payment-info {
            background: #f9f9f9;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .btn-whatsapp {
            background-color: var(--accent);
            color: white;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Artesanías Pérez</h1>
        <p>Tradición y arte hecho a mano</p>
    </header>

    <div class="container">
        <div class="grid" id="productos-grid"></div>
    </div>

    <div class="cart-float" onclick="toggleModal(true)">
        🛒 Mi Pedido <span class="badge" id="cart-count">0</span>
    </div>

    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Resumen de tu Pedido</h3>
                <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            </div>

            <div id="cart-items"></div>

            <div style="margin-top: 1rem; font-size: 1.2rem; font-weight: bold; text-align: right;">
                Total: $<span id="cart-total">0</span>
            </div>

            <div class="payment-info">
                <strong>Métodos de Pago Aceptados:</strong>
                <p>• Nequi / Daviplata / Bancolombia</p>
                <p>• Efectivo contra entrega (según ubicación)</p>
            </div>

            <button class="btn btn-whatsapp" onclick="enviarPedidoWhatsApp()">
                📲 Confirmar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <script>
        const productos = [
            {
                id: 1,
                nombre: "Bolso Tejido Artesanal",
                precio: 65000,
                descripcion: "Bolso elaborado completamente a mano con tejido de fibra resistente, tonos café y correa amplia.",
                imagen: "https://picsum.photos/400/300"
imagen: "https://picsum.photos/400/300"

            }
        ];

        const NUMERO_WHATSAPP = "573157198126";
        let carrito = [];

        function renderProductos() {
            const grid = document.getElementById('productos-grid');
            grid.innerHTML = '';

            productos.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.imagen}" alt="${p.nombre}">
                        <div class="card-content">
                            <h3>${p.nombre}</h3>
                            <p>${p.descripcion}</p>
                            <div class="price">$${p.precio.toLocaleString()}</div>
                            <button class="btn" onclick="agregarAlCarrito(${p.id})">Agregar al Carrito</button>
                        </div>
                    </div>
                `;
            });
        }

        function agregarAlCarrito(id) {
            const producto = productos.find(p => p.id === id);
            const existe = carrito.find(item => item.id === id);

            if (existe) {
                existe.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }

            actualizarCarrito();
        }

        function cambiarCantidad(id, cambio) {
            const item = carrito.find(i => i.id === id);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => i.id !== id);
                }
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const count = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            const total = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total.toLocaleString();

            const itemsContainer = document.getElementById('cart-items');
            itemsContainer.innerHTML = '';

            if (carrito.length === 0) {
                itemsContainer.innerHTML = '<p style="text-align:center; color:#888;">El carrito está vacío.</p>';
                return;
            }

            carrito.forEach(item => {
                itemsContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.nombre}</strong><br>
                            <small>$${item.precio.toLocaleString()} c/u</small>
                        </div>
                        <div class="cart-item-controls">
                            <button onclick="cambiarCantidad(${item.id}, -1)">-</button>
                            <span>${item.cantidad}</span>
                            <button onclick="cambiarCantidad(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleModal(show) {
            document.getElementById('cart-modal').style.display = show ? 'flex' : 'none';
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Agrega al menos un producto al carrito para realizar el pedido.");
                return;
            }

            const total = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
            let mensaje = "¡Hola! Quiero realizar el siguiente pedido en *Artesanías Pérez*:\n\n";

            carrito.forEach(item => {
                mensaje += `• ${item.nombre} x${item.cantidad} - $${(item.precio * item.cantidad).toLocaleString()}\n`;
            });

            mensaje += `\n*Total:* $${total.toLocaleString()}\n\n`;
            mensaje += "Por favor indícame los pasos para realizar el pago. ¡Gracias!";

            const url = `https://api.whatsapp.com/send?phone=${NUMERO_WHATSAPP}&text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        renderProductos();
    </script>
</body>
</html>
